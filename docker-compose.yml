version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kc_house_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Montamos los artefactos generados por el Agente 1 en modo sólo lectura
      - ./model/artifacts:/app/artifacts:ro
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - kc_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kc_house_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend
    networks:
      - kc_network

networks:
  kc_network:
    driver: bridge
